name: tests

# Runs the backend unit test suite on every push and pull request so a
# regression is caught automatically instead of during a demo. No Gemini API
# key is needed: backend.main guards the client (_client stays None without a
# key) and the tests either mock Gemini or exercise the no-key path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests
